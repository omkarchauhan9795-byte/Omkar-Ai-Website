<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Omkar-Ai — Your computer just grew a mind.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04070D"/>
      <stop offset=".55" stop-color="#060D18"/>
      <stop offset="1" stop-color="#04070D"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".78" cy=".35" r=".55">
      <stop stop-color="#2F8ED0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2F8ED0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".16" cy=".82" r=".5">
      <stop stop-color="#7B5CE6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7B5CE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="900" y1="120" x2="1080" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9F0FF"/>
      <stop offset=".42" stop-color="#5CE1FF"/>
      <stop offset=".76" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="core" cx=".4" cy=".36" r=".72">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#B9F5FF"/>
      <stop offset=".7" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#3B74FF"/>
    </radialGradient>
    <linearGradient id="title" x1="92" y1="250" x2="760" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#B9F5FF"/>
      <stop offset="1" stop-color="#8FAEFF"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="coreGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7DBEFF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" fill="url(#glow1)"/>
    <rect width="1200" height="630" fill="url(#glow2)"/>

    <!-- ambient orbit system -->
    <g opacity=".55" transform="translate(930 306)">
      <circle r="212" fill="none" stroke="#5CE1FF" stroke-opacity=".13"/>
      <circle r="168" fill="none" stroke="#5CE1FF" stroke-opacity=".1" stroke-dasharray="3 8"/>
      <ellipse rx="250" ry="94" fill="none" stroke="#6FA7FF" stroke-opacity=".12" transform="rotate(-24)"/>
      <ellipse rx="196" ry="66" fill="none" stroke="#A78BFA" stroke-opacity=".14" transform="rotate(32)"/>
      <circle cx="-202" cy="-42" r="4" fill="#5CE1FF" opacity=".8"/>
      <circle cx="188" cy="94" r="3" fill="#A78BFA" opacity=".8"/>
      <circle cx="146" cy="-154" r="2.5" fill="#9BEEFF" opacity=".75"/>
    </g>
    <circle cx="930" cy="306" r="150" fill="#3FA7E8" opacity=".18" filter="url(#soft)"/>

    <!-- central orb -->
    <g transform="translate(930 306)">
      <circle r="112" fill="none" stroke="url(#mark)" stroke-width="2.4" opacity=".9"/>
      <ellipse rx="142" ry="52" fill="none" stroke="url(#mark)" stroke-width="1.3" opacity=".45" transform="rotate(-26)"/>
      <circle r="50" fill="url(#core)" filter="url(#coreGlow)"/>
      <circle cx="-14" cy="-16" r="10" fill="#FFFFFF" opacity=".82"/>
    </g>

    <!-- brand -->
    <g transform="translate(88 72)">
      <g transform="scale(.88)">
        <circle cx="24" cy="24" r="17.5" fill="none" stroke="url(#mark)" stroke-width="2.6"/>
        <ellipse cx="24" cy="24" rx="21.5" ry="8.4" fill="none" stroke="url(#mark)" stroke-width="1.2" opacity=".5" transform="rotate(-28 24 24)"/>
        <circle cx="24" cy="24" r="7.2" fill="url(#core)"/>
        <circle cx="21.6" cy="21.6" r="1.9" fill="#fff" opacity=".9"/>
      </g>
      <text x="62" y="31" fill="#EAF3FF" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4.5">OMKAR<tspan fill="#5CE1FF">-AI</tspan></text>
      <text x="63" y="47" fill="#6F849C" font-family="Consolas, monospace" font-size="7.5" letter-spacing="2.4">OS-LEVEL AI ASSISTANT</text>
    </g>

    <!-- eyebrow -->
    <g transform="translate(90 218)">
      <rect width="242" height="27" rx="13.5" fill="#0A1A2B" stroke="#5CE1FF" stroke-opacity=".25"/>
      <circle cx="16" cy="13.5" r="3" fill="#55E6A5"/>
      <text x="28" y="17" fill="#8FA4BB" font-family="Consolas, monospace" font-size="8.5" letter-spacing="1.6">V3.0.0 · HERMES MIND + STONIC BODY</text>
    </g>

    <!-- headline -->
    <text x="86" y="323" fill="url(#title)" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3.4">Your computer</text>
    <text x="86" y="392" fill="url(#title)" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3.4">just grew a mind.</text>

    <!-- supporting line -->
    <text x="90" y="452" fill="#91A4BB" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" letter-spacing="-.2">A voice-first desktop agent that hears, sees, remembers, and operates</text>
    <text x="90" y="478" fill="#91A4BB" font-family="Segoe UI, Arial, sans-serif" font-size="17.5" letter-spacing="-.2">your machine — with a safety net that never lets go.</text>

    <!-- stats -->
    <g transform="translate(90 526)" font-family="Consolas, monospace" font-size="8.5" fill="#6F849C" letter-spacing="1.2">
      <text x="0" y="0"><tspan fill="#EAF3FF" font-size="17" font-weight="700">35 </tspan>HD VOICES</text>
      <text x="148" y="0"><tspan fill="#EAF3FF" font-size="17" font-weight="700">18 </tspan>BUILT-IN SKILLS</text>
      <text x="330" y="0"><tspan fill="#EAF3FF" font-size="17" font-weight="700">6 </tspan>MODEL PROVIDERS</text>
      <text x="506" y="0"><tspan fill="#EAF3FF" font-size="17" font-weight="700">100% </tspan>LOCAL MEMORY</text>
    </g>

    <!-- footer line -->
    <rect x="90" y="566" width="1020" height="1" fill="#92C4FF" fill-opacity=".12"/>
    <text x="90" y="592" fill="#5F748B" font-family="Consolas, monospace" font-size="8" letter-spacing="1.4">DESIGNED BY OMKAR CHAUHAN</text>
    <text x="1110" y="592" text-anchor="end" fill="#5F748B" font-family="Consolas, monospace" font-size="8" letter-spacing="1.4">WINDOWS 10/11 · NO GPU REQUIRED</text>
  </g>
</svg>
